<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dino Multiplayer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loginScreen" class="screen">
        <h1 class="neon-text">DINO RACE</h1>
        <input type="text" id="playerName" placeholder="Seu Nome" class="neon-input">
        <button id="btnCreateRoom" class="neon-button">Criar Mundo</button>
        <br><br>
        <input type="text" id="roomCodeInput" placeholder="Código do Mundo" class="neon-input">
        <button id="btnJoinRoom" class="neon-button">Entrar em Mundo</button>
    </div>

    <div id="waitingScreen" class="screen" style="display: none;">
        <h2 class="neon-text">Mundo Criado!</h2>
        <p>Passe este código para seu adversário:</p>
        <h1 id="displayRoomCode" class="neon-text code-box"></h1>
        <p>Aguardando jogador...</p>
        <br>
        <button onclick="window.location.reload()" class="neon-button small-btn">Cancelar e Voltar</button>
    </div>

    <div id="gameScreen" class="screen" style="display: none;">
        <div id="gameBoard">
            <div id="dino" class="sprite"></div>
            <div id="obstacle" class="sprite"></div>
        </div>
        <div class="players-info">
            <span id="p1Name" class="neon-text-small">Você</span> VS <span id="p2Name" class="neon-text-small">Adversário</span>
        </div>
        <button id="btnJump" class="neon-button jump-btn">PULAR!</button>
    </div>

    <div id="gameOverScreen" class="screen" style="display: none;">
        <h1 id="winnerText" class="neon-text">FIM DE JOGO</h1>
        <br>
        <button onclick="window.location.reload()" class="neon-button">Jogar Novamente (Menu)</button>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
